<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cena Verano 2026</title>
    <!-- Usamos Tailwind CSS para darle un estilo moderno y adaptado a pantallas grandes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a; 
            color: white;
            overflow: hidden; 
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* CLASES DE FONDOS DINÁMICOS */
        .bg-bingo {
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.5), transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.5), transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(234, 179, 8, 0.3), transparent 60%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease;
        }

        .bg-sorteo {
            background-image: linear-gradient(rgba(15, 23, 42, 0.15), rgba(15, 23, 42, 0.15)), url('https://raw.githubusercontent.com/AVS-PROJECTS33/Cena_Verano_2026/main/FOTOCENAVERANO.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease;
        }

        /* Utilidad para ocultar elementos fluidamente */
        .hidden-view {
            display: none !important;
        }

        /* Estilos del Bingo */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.5rem;
            height: 100%;
        }

        .bingo-number {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.6); 
            color: #ffffff;
            border: 2px solid rgba(51, 65, 85, 0.8);
            border-radius: 0.5rem;
            font-size: 2vw; 
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .bingo-number.drawn {
            background-color: #22c55e; 
            border-color: #16a34a;
            color: #000000; 
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
            backdrop-filter: none; 
        }

        .bingo-number.last-drawn {
            background-color: #10b981;
            border-color: #059669;
            color: #000000; 
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
            animation: pulse-green 1.5s infinite;
            backdrop-filter: none;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Estilos de la Ruleta */
        #roulette-container {
            position: relative;
            width: 80vh;
            height: 80vh;
            margin: 0 auto;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background-color: rgba(30, 41, 59, 0.9); 
        }

        .play-button-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ef4444 0%, #b91c1c 100%);
            border: 4px solid white;
            border-radius: 50%;
            color: white;
            font-weight: 900;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 5px 10px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            z-index: 10;
        }

        .play-button-center:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .play-button-center:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: translate(-50%, -50%);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 45px solid #facc15; 
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            transform-origin: top center; 
            transition: transform 0.05s ease-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8); 
            border-radius: 4px;
        }
    </style>
</head>
<body id="main-body" class="flex flex-col h-screen bg-bingo">

    <!-- Header / Navbar -->
    <header class="bg-gray-900/30 backdrop-blur-md border-b border-gray-800/30 p-4 flex justify-between items-center shadow-lg h-[10vh]">
        <div class="text-2xl font-black tracking-wider flex items-center gap-3 text-yellow-400 bg-black/40 px-4 py-2 rounded-xl backdrop-blur-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            CENA VERANO 2026
        </div>
        <div class="flex gap-4">
            <button onclick="switchView('bingo')" id="tab-bingo" class="px-6 py-2 rounded-full font-bold transition-colors bg-blue-600/90 text-white hover:bg-blue-500 shadow-md">
                Jugar al Bingo
            </button>
            <button onclick="switchView('sorteo')" id="tab-sorteo" class="px-6 py-2 rounded-full font-bold transition-colors bg-gray-800/80 text-gray-200 hover:bg-gray-700 shadow-md">
                Sorteo / Ruleta
            </button>
        </div>
    </header>

    <!-- CONTENEDOR BINGO -->
    <main id="view-bingo" class="flex flex-1 h-[90vh]">
        <div class="w-1/3 bg-gray-800/20 backdrop-blur-md p-6 flex flex-col items-center justify-between border-r border-gray-700/30 h-full overflow-y-auto">
            
            <div class="text-center w-full mb-4">
                <h2 class="text-3xl font-bold text-gray-200 mb-4 uppercase tracking-widest bg-black/40 inline-block px-6 py-1 rounded-full backdrop-blur-sm">Número Actual</h2>
                <div class="bg-black/80 border-4 border-yellow-500 rounded-3xl w-full aspect-[4/3] max-h-60 flex items-center justify-center shadow-2xl relative mx-auto overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent"></div>
                    <span id="current-number-display" class="text-9xl font-black text-white" style="font-size: 8rem;">--</span>
                </div>
            </div>

            <div class="w-full flex flex-col gap-4 flex-1 justify-end">
                <button id="toggleBingoBtn" onclick="toggleBingoAuto()" class="w-full bg-green-600/90 hover:bg-green-500 text-white font-bold py-5 px-4 rounded-2xl text-2xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-3 backdrop-blur-sm">
                    <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <span id="toggleBingoText">INICIAR BINGO</span>
                </button>

                <div class="flex justify-between text-gray-200 text-xl px-4 py-2 my-1 font-semibold bg-black/40 rounded-xl backdrop-blur-sm border border-gray-700/50">
                    <span>Extraídos: <span id="drawn-count" class="text-white font-bold">0</span>/90</span>
                    <span id="status-text" class="text-yellow-400">Esperando...</span>
                </div>

                <div class="w-full flex justify-center mt-2">
                    <button id="resetBingoBtn" onclick="requestBingoReset()" class="w-3/4 bg-red-600/90 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl text-lg shadow-lg transition-colors flex items-center justify-center gap-2 backdrop-blur-sm border border-red-500/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        <span id="resetBingoText">Reiniciar</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="w-2/3 bg-gray-900/50 backdrop-blur-sm p-6 h-full border-l border-gray-700/30">
            <div id="bingo-board" class="bingo-grid">
            </div>
        </div>
    </main>

    <!-- CONTENEDOR SORTEO (RULETA) -->
    <main id="view-sorteo" class="flex flex-1 h-[90vh] hidden-view bg-transparent">
        
        <div class="w-1/4 bg-gray-800/30 backdrop-blur-md border-r border-gray-700/40 p-6 flex flex-col relative h-full">
            
            <div id="view-list-manager" class="flex-1 flex flex-col h-full min-h-0">
                <h2 class="text-2xl font-bold mb-4 text-yellow-400 bg-black/40 inline-block px-4 py-1 rounded-lg backdrop-blur-sm w-fit">Mis Listas</h2>
                
                <div id="lists-container" class="flex-1 overflow-y-auto space-y-2 mb-4 pr-2">
                </div>

                <button onclick="showEditList()" class="w-full bg-green-600/90 hover:bg-green-500 text-white font-bold py-4 px-4 rounded-xl mt-auto transition-colors flex items-center justify-center gap-2 shadow-lg backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    Crear Nueva Lista
                </button>
            </div>

            <div id="view-list-editor" class="flex-1 flex flex-col h-full hidden-view bg-gray-900/60 p-4 rounded-2xl border border-gray-700/50 backdrop-blur-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="editor-title" class="text-2xl font-bold text-yellow-400">Nueva Lista</h2>
                    <button onclick="deleteCurrentList()" id="btn-delete-list" class="text-red-400 hover:text-red-300 hidden p-2 bg-red-900/30 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </div>
                
                <input type="text" id="list-name-input" class="w-full bg-black/60 text-white p-3 rounded-xl border border-gray-600/50 focus:border-yellow-500 mb-3 backdrop-blur-sm" placeholder="Ej: Departamento IT">
                
                <p class="text-xs text-gray-300 mb-2 font-medium">Escribe un nombre por línea o separados por comas.</p>
                <textarea id="names-input" class="w-full flex-1 bg-black/60 text-white p-4 rounded-xl border border-gray-600/50 focus:border-yellow-500 focus:outline-none resize-none text-lg mb-4 backdrop-blur-sm" placeholder="Juan Pérez&#10;María López&#10;Carlos García..."></textarea>
                
                <p id="list-error-msg" class="text-red-400 text-sm mb-2 hidden-view bg-red-900/40 p-2 rounded-lg">Debes añadir al menos 1 nombre.</p>

                <div class="flex gap-2 mt-auto">
                    <button onclick="hideEditList()" class="w-1/3 bg-gray-600/90 hover:bg-gray-500 text-white font-bold py-3 rounded-xl transition-colors">Volver</button>
                    <button onclick="saveList()" class="w-2/3 bg-blue-600/90 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">Guardar y Usar</button>
                </div>
            </div>

        </div>

        <div class="w-3/4 flex flex-col items-center justify-center relative p-8 bg-gray-900/10 backdrop-blur-sm">
            <div id="roulette-container">
                <div class="pointer"></div>
                <canvas id="roulette-canvas" width="800" height="800" class="w-full h-full"></canvas>
                <button id="spin-btn" onclick="spinRoulette()" class="play-button-center">
                    PLAY
                </button>
            </div>
        </div>
    </main>

    <!-- Modal de Ganador Sorteo -->
    <div id="winner-modal" class="fixed inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center z-50 hidden-view opacity-0 transition-opacity duration-500">
        <div class="bg-gray-900/90 backdrop-blur-xl border-4 border-yellow-500 rounded-3xl p-12 text-center shadow-2xl max-w-3xl min-w-[50vw] transform scale-90 transition-transform duration-500" id="winner-modal-content">
            <h2 class="text-4xl text-gray-300 font-bold mb-4">¡TENEMOS UN GANADOR/A!</h2>
            <div id="winner-name" class="text-7xl font-black text-yellow-400 mb-8 py-6 uppercase break-words drop-shadow-lg">Nombre</div>
            <button onclick="closeWinnerModal()" class="bg-white/90 text-black font-bold py-3 px-8 rounded-full text-xl hover:bg-white transition-colors shadow-lg">
                Continuar
            </button>
        </div>
    </div>


    <script>
        // ==========================================
        // SOPORTE PARA BOTÓN FÍSICO USB (y Teclado)
        // ==========================================
        document.addEventListener('keydown', (event) => {
            // Ignorar si estamos escribiendo en los inputs para no disparar la ruleta por error
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;

            // La mayoría de botones USB envían Espacio o Enter
            if (event.code === 'Space' || event.code === 'Enter') {
                
                if (event.code === 'Space') event.preventDefault(); // Evita scroll de pantalla

                const viewBingo = document.getElementById('view-bingo');
                const viewSorteo = document.getElementById('view-sorteo');
                const winnerModal = document.getElementById('winner-modal');

                // 1. Si hay un cartel de ganador en pantalla, el botón lo cierra
                if (!winnerModal.classList.contains('hidden-view')) {
                    closeWinnerModal();
                    return;
                }

                // 2. Si estamos en BINGO, el botón pausa/reanuda
                if (!viewBingo.classList.contains('hidden-view')) {
                    // Evitar iniciar si se está reseteando
                    if(resetConfirmStage === 0 && document.getElementById('toggleBingoBtn').disabled === false) {
                        toggleBingoAuto();
                    }
                }
                
                // 3. Si estamos en SORTEO, el botón gira la ruleta
                else if (!viewSorteo.classList.contains('hidden-view')) {
                    // Solo si no está girando ya, y hay lista
                    if (!isSpinning && namesList.length > 0 && namesList[0] !== "Crea") {
                        spinRoulette();
                    }
                }
            }
        });


        // ==========================================
        // SISTEMA DE NAVEGACIÓN
        // ==========================================
        function switchView(viewName) {
            const viewBingo = document.getElementById('view-bingo');
            const viewSorteo = document.getElementById('view-sorteo');
            const tabBingo = document.getElementById('tab-bingo');
            const tabSorteo = document.getElementById('tab-sorteo');
            const body = document.getElementById('main-body');

            if (viewName === 'bingo') {
                viewBingo.classList.remove('hidden-view');
                viewSorteo.classList.add('hidden-view');
                
                body.classList.remove('bg-sorteo');
                body.classList.add('bg-bingo');
                
                tabBingo.className = "px-6 py-2 rounded-full font-bold transition-colors bg-blue-600/90 text-white hover:bg-blue-500 shadow-md";
                tabSorteo.className = "px-6 py-2 rounded-full font-bold transition-colors bg-gray-800/80 text-gray-200 hover:bg-gray-700 shadow-md";
            } else {
                viewSorteo.classList.remove('hidden-view');
                viewBingo.classList.add('hidden-view');
                
                body.classList.remove('bg-bingo');
                body.classList.add('bg-sorteo');
                
                tabSorteo.className = "px-6 py-2 rounded-full font-bold transition-colors bg-blue-600/90 text-white hover:bg-blue-500 shadow-md";
                tabBingo.className = "px-6 py-2 rounded-full font-bold transition-colors bg-gray-800/80 text-gray-200 hover:bg-gray-700 shadow-md";
                
                drawRoulette();
            }
        }

        // ==========================================
        // LÓGICA DEL BINGO
        // ==========================================
        const totalNumbers = 90;
        let availableNumbers = [];
        let drawnNumbers = [];
        let bingoInterval = null;
        let countdownInterval = null;
        let isPlaying = false;
        
        let resetConfirmStage = 0;
        let resetTimeout = null;

        function initBingoBoard() {
            const board = document.getElementById('bingo-board');
            board.innerHTML = '';
            for (let i = 1; i <= totalNumbers; i++) {
                const numDiv = document.createElement('div');
                numDiv.className = 'bingo-number';
                numDiv.id = `num-${i}`;
                numDiv.innerText = i;
                board.appendChild(numDiv);
            }
            resetBingoData();
        }

        function resetBingoData() {
            availableNumbers = Array.from({length: totalNumbers}, (_, i) => i + 1);
            drawnNumbers = [];
            document.getElementById('current-number-display').innerText = '--';
            document.getElementById('drawn-count').innerText = '0';
            
            for (let i = 1; i <= totalNumbers; i++) {
                const el = document.getElementById(`num-${i}`);
                if(el) {
                    el.classList.remove('drawn', 'last-drawn');
                }
            }
            
            stopBingoAuto();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel(); // Detener audio si reiniciamos
        }

        // ==========================================
        // NUEVA FUNCIÓN DE AUDIO
        // ==========================================
        function announceNumber(num) {
            // Comprobar si el navegador soporta voz
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel(); // Detener cualquier audio previo
            
            let numStr = num.toString();
            let textToSpeak = "";
            
            if (numStr.length === 2) {
                // Formato: "Setenta y cinco... siete... cinco"
                // Añadimos comas para generar pausas naturales en la voz
                textToSpeak = `${num}, , ${numStr[0]}, , ${numStr[1]}`;
            } else {
                // Formato: "El... siete"
                textToSpeak = `El , , ${num}`;
            }
            
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'es-ES'; // Voz en español de España
            utterance.rate = 0.85; // Un poco más despacio para darle intriga
            
            window.speechSynthesis.speak(utterance);
        }

        function drawSingleNumber() {
            if (availableNumbers.length === 0) {
                stopBingoAuto();
                document.getElementById('status-text').innerText = "¡BINGO COMPLETADO!";
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const number = availableNumbers.splice(randomIndex, 1)[0];
            drawnNumbers.push(number);
            
            if (drawnNumbers.length > 1) {
                const prevNumber = drawnNumbers[drawnNumbers.length - 2];
                document.getElementById(`num-${prevNumber}`).classList.remove('last-drawn');
            }

            document.getElementById('current-number-display').innerText = number;
            document.getElementById('drawn-count').innerText = drawnNumbers.length;
            
            const boardCell = document.getElementById(`num-${number}`);
            boardCell.classList.add('drawn', 'last-drawn');
            
            announceNumber(number); // Llamada a la función de audio cada vez que sale bola
        }

        function toggleBingoAuto() {
            if (isPlaying) {
                stopBingoAuto();
            } else {
                startBingoAuto();
            }
        }

        function startBingoAuto() {
            if (availableNumbers.length === 0) return;
            
            isPlaying = true;
            
            // Desbloquear el motor de voz del navegador con la interacción de inicio
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let initAudio = new SpeechSynthesisUtterance("Atención, comenzamos.");
                initAudio.lang = 'es-ES';
                window.speechSynthesis.speak(initAudio);
            }
            
            document.getElementById('toggleBingoBtn').className = "w-full bg-yellow-600/90 hover:bg-yellow-500 text-white font-bold py-5 px-4 rounded-2xl text-2xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-3 backdrop-blur-sm";
            document.getElementById('playIcon').classList.add('hidden');
            document.getElementById('pauseIcon').classList.remove('hidden');
            document.getElementById('toggleBingoText').innerText = "PAUSAR (LÍNEA/BINGO)";

            let countdown = 5;
            document.getElementById('status-text').innerText = `Arrancando... (${countdown}s)`;
            
            countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    document.getElementById('status-text').innerText = `Arrancando... (${countdown}s)`;
                } else {
                    clearInterval(countdownInterval);
                    document.getElementById('status-text').innerText = "Sorteando...";
                    drawSingleNumber();
                    bingoInterval = setInterval(drawSingleNumber, 5000);
                }
            }, 1000);
        }

        function stopBingoAuto() {
            isPlaying = false;
            clearInterval(bingoInterval);
            clearInterval(countdownInterval);
            document.getElementById('status-text').innerText = "Pausado";
            
            const btn = document.getElementById('toggleBingoBtn');
            btn.className = "w-full bg-green-600/90 hover:bg-green-500 text-white font-bold py-5 px-4 rounded-2xl text-2xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-3 backdrop-blur-sm";
            document.getElementById('pauseIcon').classList.add('hidden');
            document.getElementById('playIcon').classList.remove('hidden');
            
            if(availableNumbers.length === 0) {
                document.getElementById('toggleBingoText').innerText = "PARTIDA FINALIZADA";
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                document.getElementById('toggleBingoText').innerText = "CONTINUAR JUEGO";
            }
        }

        function requestBingoReset() {
            const btn = document.getElementById('resetBingoBtn');
            const text = document.getElementById('resetBingoText');

            if (resetConfirmStage === 0) {
                resetConfirmStage = 1;
                text.innerText = "¿Seguro?"; 
                btn.className = "w-3/4 bg-orange-500/90 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-xl text-lg shadow-lg transition-colors flex items-center justify-center gap-2 backdrop-blur-sm border border-orange-400/50";
                
                resetTimeout = setTimeout(() => {
                    cancelBingoReset();
                }, 3000);
            } else if (resetConfirmStage === 1) {
                clearTimeout(resetTimeout);
                resetBingoData();
                cancelBingoReset(); 
                
                const playBtn = document.getElementById('toggleBingoBtn');
                playBtn.disabled = false;
                playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                document.getElementById('toggleBingoText').innerText = "INICIAR BINGO";
            }
        }

        function cancelBingoReset() {
            const btn = document.getElementById('resetBingoBtn');
            const text = document.getElementById('resetBingoText');
            resetConfirmStage = 0;
            text.innerText = "Reiniciar";
            btn.className = "w-3/4 bg-red-600/90 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl text-lg shadow-lg transition-colors flex items-center justify-center gap-2 backdrop-blur-sm border border-red-500/50";
        }


        // ==========================================
        // LÓGICA DEL SORTEO Y GESTIÓN DE LISTAS
        // ==========================================
        let savedLists = [];
        let currentEditingId = null;
        let currentActiveListId = null;

        const canvas = document.getElementById('roulette-canvas');
        const ctx = canvas.getContext('2d');
        let namesList = ["Crea", "una", "Lista"];
        
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', 
            '#22c55e', '#14b8a6', '#0ea5e9', '#3b82f6', 
            '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e'
        ];

        let currentAngle = 0;
        let spinVelocity = 0;
        let isSpinning = false;
        let animationFrame;

        // --- SISTEMA DE LISTAS ---
        function initLists() {
            const stored = localStorage.getItem('rouletteLists_cena2026');
            if (stored) {
                savedLists = JSON.parse(stored);
            } else {
                savedLists = [{
                    id: Date.now(), 
                    name: 'Plantilla de Ejemplo', 
                    names: ['Laura', 'Pedro', 'Marta', 'Carlos', 'Ana', 'David']
                }];
                saveListsToStorage();
            }
            
            renderLists();
            
            if(savedLists.length > 0) {
                selectList(savedLists[0].id);
            } else {
                drawRoulette();
            }
        }

        function saveListsToStorage() {
            localStorage.setItem('rouletteLists_cena2026', JSON.stringify(savedLists));
        }

        function renderLists() {
            const container = document.getElementById('lists-container');
            container.innerHTML = '';
            
            if (savedLists.length === 0) {
                container.innerHTML = '<p class="text-gray-400 font-medium text-sm text-center mt-4 bg-black/30 p-3 rounded-lg">No hay listas guardadas.</p>';
                return;
            }

            savedLists.forEach(list => {
                const div = document.createElement('div');
                let bgClass = list.id === currentActiveListId ? 'bg-blue-900/80 border-blue-400' : 'bg-black/40 border-gray-600/50';
                let hoverClass = list.id === currentActiveListId ? 'hover:bg-blue-800/90' : 'hover:bg-black/60';
                
                div.className = `${bgClass} ${hoverClass} border p-4 rounded-xl cursor-pointer flex justify-between items-center group transition-colors backdrop-blur-sm`;
                div.onclick = () => selectList(list.id);
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex flex-col overflow-hidden pr-2';
                
                const title = document.createElement('span');
                title.className = `font-bold ${list.id === currentActiveListId ? 'text-yellow-400' : 'text-gray-200 group-hover:text-white'} truncate text-lg drop-shadow-md`;
                title.innerText = list.name;
                
                const count = document.createElement('span');
                count.className = 'text-xs text-gray-400 font-medium';
                count.innerText = `${list.names.length} personas`;
                
                infoDiv.appendChild(title);
                infoDiv.appendChild(count);

                const editBtn = document.createElement('button');
                editBtn.className = 'bg-gray-700/80 text-gray-300 hover:text-white hover:bg-gray-600 p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-all border border-gray-600/50';
                editBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>';
                editBtn.title = "Editar lista";
                editBtn.onclick = (e) => { e.stopPropagation(); showEditList(list.id); };
                
                div.appendChild(infoDiv);
                div.appendChild(editBtn);
                container.appendChild(div);
            });
        }

        function showEditList(id = null) {
            document.getElementById('view-list-manager').classList.add('hidden-view');
            document.getElementById('view-list-editor').classList.remove('hidden-view');
            document.getElementById('list-error-msg').classList.add('hidden-view');
            
            const btnDelete = document.getElementById('btn-delete-list');
            
            if (id) {
                const list = savedLists.find(l => l.id === id);
                document.getElementById('editor-title').innerText = 'Editar Lista';
                document.getElementById('list-name-input').value = list.name;
                document.getElementById('names-input').value = list.names.join('\n');
                currentEditingId = id;
                btnDelete.classList.remove('hidden');
            } else {
                document.getElementById('editor-title').innerText = 'Nueva Lista';
                document.getElementById('list-name-input').value = '';
                document.getElementById('names-input').value = '';
                currentEditingId = null;
                btnDelete.classList.add('hidden');
            }
        }

        function hideEditList() {
            document.getElementById('view-list-manager').classList.remove('hidden-view');
            document.getElementById('view-list-editor').classList.add('hidden-view');
            currentEditingId = null;
        }

        function saveList() {
            const nameInput = document.getElementById('list-name-input').value.trim();
            const namesInput = document.getElementById('names-input').value;
            const errorMsg = document.getElementById('list-error-msg');
            
            const listName = nameInput || 'Lista sin nombre';
            const parsedNames = namesInput.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            
            if(parsedNames.length === 0) {
                errorMsg.classList.remove('hidden-view');
                return;
            }
            errorMsg.classList.add('hidden-view');

            let targetId; // Creamos una variable para no perder el ID al ocultar el panel

            if (currentEditingId) {
                const list = savedLists.find(l => l.id === currentEditingId);
                list.name = listName;
                list.names = parsedNames;
                targetId = currentEditingId;
            } else {
                const newList = {
                    id: Date.now(),
                    name: listName,
                    names: parsedNames
                };
                savedLists.push(newList);
                targetId = newList.id;
            }
            
            saveListsToStorage();
            hideEditList(); // Esto pone currentEditingId a null
            selectList(targetId); // Usamos nuestro targetId guardado, ahora sí se mostrará al momento
        }

        function deleteCurrentList() {
            document.getElementById('editor-title').innerText = '¿Borrar Lista?';
            document.getElementById('btn-delete-list').classList.add('hidden');
            
            const oldSaveBtn = document.querySelector('#view-list-editor .bg-blue-600\\/90');
            const clone = oldSaveBtn.cloneNode(true);
            oldSaveBtn.parentNode.replaceChild(clone, oldSaveBtn);
            
            clone.classList.replace('bg-blue-600/90', 'bg-red-600/90');
            clone.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
            clone.innerText = "Sí, eliminar";
            
            clone.onclick = () => {
                savedLists = savedLists.filter(l => l.id !== currentEditingId);
                saveListsToStorage();
                hideEditList();
                
                if(savedLists.length > 0) {
                    selectList(savedLists[0].id);
                } else {
                    currentActiveListId = null;
                    namesList = ["Crea", "una", "Lista"];
                    drawRoulette();
                    renderLists();
                }

                clone.parentNode.replaceChild(oldSaveBtn, clone);
                oldSaveBtn.onclick = saveList;
            };
            
            const backBtn = document.querySelector('#view-list-editor .bg-gray-600\\/90');
            backBtn.addEventListener('click', function restoreBtn() {
                if(clone.parentNode) clone.parentNode.replaceChild(oldSaveBtn, clone);
                oldSaveBtn.onclick = saveList;
                backBtn.removeEventListener('click', restoreBtn);
            }, {once: true});
        }

        function selectList(id) {
            if(isSpinning) return;
            
            const list = savedLists.find(l => l.id === id);
            if(list) {
                currentActiveListId = id;
                namesList = [...list.names];
                
                if (namesList.length < 2) {
                    namesList.push("Tira otra", "vez");
                }

                currentAngle = 0;
                drawRoulette();
                renderLists(); 
            }
        }

        // --- DIBUJO DE RULETA ---
        function drawRoulette() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 15; 

            const sliceAngle = (2 * Math.PI) / namesList.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);

            for (let i = 0; i < namesList.length; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.closePath();
                
                let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
                gradient.addColorStop(0, '#ffffff40'); 
                gradient.addColorStop(1, colors[i % colors.length]);
                
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                ctx.save();
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle'; 
                
                let fontSize = 32;
                if(namesList.length > 20) fontSize = 22;
                if(namesList.length > 40) fontSize = 16;
                
                ctx.font = `900 ${fontSize}px Montserrat`;
                
                let text = namesList[i];
                if(text.length > 18) text = text.substring(0, 16) + '...';
                
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.strokeText(text, radius - 40, 0);
                
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(text, radius - 40, 0);
                
                ctx.restore();
            }
            
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();
            
            for (let i = 0; i < namesList.length; i++) {
                let angle = i * sliceAngle;
                let pegX = Math.cos(angle) * (radius - 5);
                let pegY = Math.sin(angle) * (radius - 5);
                ctx.beginPath();
                ctx.arc(pegX, pegY, 5, 0, 2 * Math.PI);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, 2 * Math.PI);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#facc15';
            ctx.stroke();
            
            ctx.restore();
        }

        function spinRoulette() {
            if (isSpinning || namesList.length === 0 || (namesList.length === 3 && namesList[0] === "Crea")) return;
            
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            
            // Más velocidad inicial para alargar el tiempo total
            spinVelocity = 0.8 + Math.random() * 0.4; 
            
            animateRoulette();
        }

        let lastPegIndex = -1;

        function animateRoulette() {
            currentAngle += spinVelocity;
            
            const sliceAngle = (2 * Math.PI) / namesList.length;
            const pointerAngle = (3 * Math.PI / 2); 
            const normalizedAngle = currentAngle % (2 * Math.PI);
            const winAngle = (pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
            
            const currentPegIndex = Math.floor(winAngle / sliceAngle);

            const pointer = document.querySelector('.pointer');
            if (currentPegIndex !== lastPegIndex) {
                lastPegIndex = currentPegIndex;
                pointer.style.transform = `translateX(-50%) rotate(${-15 - Math.random() * 10}deg)`;
                setTimeout(() => {
                    pointer.style.transform = 'translateX(-50%) rotate(0deg)';
                }, 50); 
            }

            // Ajustada la fricción (0.993 en vez de 0.985) para que tarde mucho más en detenerse (aprox +5 a +8 segundos)
            if (spinVelocity > 0.1) {
                spinVelocity *= 0.993; 
            } else if (spinVelocity > 0.002) {
                spinVelocity *= 0.985; 
            } else {
                spinVelocity = 0;
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
                pointer.style.transform = 'translateX(-50%) rotate(0deg)'; 
                determineWinner();
                cancelAnimationFrame(animationFrame);
                return;
            }

            drawRoulette();
            animationFrame = requestAnimationFrame(animateRoulette);
        }

        function determineWinner() {
            const normalizedAngle = currentAngle % (2 * Math.PI);
            const pointerAngle = (3 * Math.PI / 2); 
            
            let winAngle = (pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
            
            const sliceAngle = (2 * Math.PI) / namesList.length;
            const winningIndex = Math.floor(winAngle / sliceAngle);
            
            const winner = namesList[winningIndex];
            
            showWinnerModal(winner);
        }

        function showWinnerModal(winnerName) {
            const modal = document.getElementById('winner-modal');
            const content = document.getElementById('winner-modal-content');
            document.getElementById('winner-name').innerText = winnerName;
            
            modal.classList.remove('hidden-view');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            }, 10);
            
            let colorsWin = ['#facc15', '#ef4444', '#22c55e', '#3b82f6', '#facc15'];
            let colorIdx = 0;
            const flashInt = setInterval(() => {
                if(modal.classList.contains('hidden-view')) {
                    clearInterval(flashInt);
                } else {
                    document.getElementById('winner-name').style.color = colorsWin[colorIdx];
                    colorIdx = (colorIdx + 1) % colorsWin.length;
                }
            }, 200);
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winner-modal');
            const content = document.getElementById('winner-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-90');
            
            setTimeout(() => {
                modal.classList.add('hidden-view');
            }, 500); 
        }

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        window.onload = () => {
            initBingoBoard();
            initLists();
            switchView('bingo'); 
        };
        
        window.onresize = () => {
            if(!document.getElementById('view-sorteo').classList.contains('hidden-view')){
                drawRoulette();
            }
        }

    </script>
</body>
